global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'stockpredict-monitor'

scrape_configs:
  # Backend FastAPI metrics
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics (if pg_exporter is added)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['db:9187']

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
